  --warn:#a6720a; --warn-soft:#f9efd7; --warn-line:#ecd6a3;
  --bad:#d23b3b;  --bad-soft:#fceceb;  --bad-line:#f3cecd;
  /* brand periwinkle #567DE8 */
  --info:#567de8; --info-soft:#e8eefc;
  --grad:linear-gradient(135deg,#005dff,#8460d4);
  --sh-1:0 1px 2px rgba(15,21,36,.05);
  --sh-2:0 2px 4px rgba(15,21,36,.05), 0 8px 20px -12px rgba(0,52,140,.2);
  --sh-pop:0 4px 8px rgba(15,21,36,.06), 0 24px 48px -20px rgba(0,52,140,.3);
  --r-lg:14px; --r-md:11px; --r-sm:8px; --r-xs:6px;
  --sans:'Poppins',system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:'Poppins',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --sb:248px;
}

  --ink:#eef1f8; --ink-2:#9aa4ba; --ink-3:#6a7488; --ink-4:#4a5265;

}}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0; background:var(--canvas); color:var(--ink); font-family:var(--sans);
  font-size:14px; line-height:1.45; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility}
h1,h2,h3,h4{margin:0; font-weight:600; letter-spacing:-.014em}
p{margin:0}
button{font-family:inherit}
::selection{background:var(--accent-soft)}
.tnum{font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1}
.mono{font-family:var(--mono)}
.eyebrow{font-size:10.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3)}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .info{color:var(--info)}
.bg-good{background:var(--good)} .bg-warn{background:var(--warn)} .bg-bad{background:var(--bad)} .bg-accent{background:var(--accent)}
svg{display:block}

/* ── app shell ───────────────────────────────────────────── */
.app{display:flex; min-height:100vh}
.sidebar{width:var(--sb); flex:none; position:sticky; top:0; height:100vh;
  background:var(--surface); border-right:1px solid var(--line);
  display:flex; flex-direction:column; padding:16px 14px; gap:4px; z-index:30}
.sb-brand{display:flex; align-items:center; gap:11px; padding:8px 10px 14px}
.sb-mark{width:32px; height:32px; flex:none; display:grid; place-items:center}
.sb-mark svg{width:32px; height:32px}
.sb-brand b{font-size:13.5px; font-weight:650; letter-spacing:-.02em; display:block; line-height:1.2}
.sb-brand span{font-size:10.5px; color:var(--ink-3); letter-spacing:.02em}
.sb-sec{font-size:10px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-4);
  padding:14px 12px 6px}
.nav{border:0; background:none; width:100%; text-align:left; cursor:pointer; color:var(--ink-2);
  display:flex; align-items:center; gap:11px; padding:8px 12px; border-radius:var(--r-sm);
  font-size:13.5px; font-weight:500; transition:background .13s, color .13s; position:relative}
.nav svg{width:17px; height:17px; flex:none; stroke-width:1.6}
.nav:hover{background:var(--surface-2); color:var(--ink)}
.nav[aria-current="page"]{background:var(--accent-soft); color:var(--accent); font-weight:600}
.nav[aria-current="page"]::before{content:""; position:absolute; left:-14px; top:9px; bottom:9px; width:3px;
  border-radius:0 3px 3px 0; background:var(--accent)}
.nav .count{margin-left:auto; font-size:11px; font-weight:650; padding:1px 7px; border-radius:20px;
  background:var(--bad-soft); color:var(--bad); font-variant-numeric:tabular-nums}
.nav:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
.sb-foot{margin-top:auto; padding:12px 10px 4px; border-top:1px solid var(--line); display:flex; flex-direction:column; gap:10px}
.sb-status{display:flex; align-items:center; gap:8px; font-size:11.5px; color:var(--ink-2)}
.live{width:7px; height:7px; border-radius:50%; background:var(--good); flex:none; position:relative}
.live::after{content:""; position:absolute; inset:-3px; border-radius:50%; border:1.5px solid var(--good); opacity:.35;
  animation:ping 2.4s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{0%{transform:scale(.6);opacity:.5}80%,100%{transform:scale(1.5);opacity:0}}
@media (prefers-reduced-motion:reduce){ .live::after{animation:none} }
.sb-status b{color:var(--ink); font-weight:600}

/* content */
.content{flex:1; min-width:0; display:flex; flex-direction:column}
.topbar{position:sticky; top:0; z-index:20; background:color-mix(in srgb,var(--canvas) 82%,transparent);
  -webkit-backdrop-filter:saturate(180%) blur(12px); backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line); padding:0 26px}
.topin{height:60px; display:flex; align-items:center; gap:16px; max-width:1240px; margin:0 auto}
.tb-title h1{font-size:16px; font-weight:650; letter-spacing:-.02em; line-height:1.2}
.tb-title p{font-size:12px; color:var(--ink-3); margin-top:1px}
.tb-right{margin-left:auto; display:flex; align-items:center; gap:10px}
.search{display:none; align-items:center; gap:8px; background:var(--surface-2); border:1px solid var(--line);
  border-radius:var(--r-sm); padding:6px 10px; width:200px; transition:border-color .15s, box-shadow .15s}
.search.on{display:flex}
.search:focus-within{border-color:var(--accent-line); box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{width:15px; height:15px; color:var(--ink-3); flex:none}
.search input{border:0; background:none; outline:0; color:var(--ink); font-size:13px; width:100%}
.search input::placeholder{color:var(--ink-3)}
.segset{display:inline-flex; border:1px solid var(--line); border-radius:var(--r-sm); overflow:hidden; background:var(--surface)}
.segset button{border:0; background:none; cursor:pointer; font-size:12.5px; font-weight:540; color:var(--ink-2);
  padding:6px 12px; border-right:1px solid var(--line); transition:background .14s, color .14s}
.segset button:last-child{border-right:0}
.segset button:hover{color:var(--ink)}
.segset button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink)}
.segset button:focus-visible{outline:2px solid var(--accent); outline-offset:-2px; position:relative; z-index:1}
.segset.subtle button[aria-pressed="true"]{background:var(--surface-3); color:var(--ink)}
.iconbtn{width:34px; height:34px; border:1px solid var(--line); background:var(--surface); border-radius:var(--r-sm);
  cursor:pointer; color:var(--ink-2); display:grid; place-items:center; flex:none; transition:border-color .14s, color .14s}
.iconbtn:hover{color:var(--ink); border-color:var(--line-strong)}
.iconbtn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.iconbtn svg{width:16px; height:16px}
.avatar{width:34px; height:34px; border-radius:50%; flex:none; display:grid; place-items:center;
  font-size:12px; font-weight:650; color:#fff; background:var(--grad); letter-spacing:.02em}

.main{max-width:1240px; margin:0 auto; width:100%; padding:24px 26px 80px}
.page{display:none}
.page.on{display:block}
@media (prefers-reduced-motion:no-preference){
  .page.on > .stg{opacity:0; transform:translateY(8px); animation:rise .5s cubic-bezier(.2,.7,.2,1) forwards}
  .stg.s1{animation-delay:.02s}.stg.s2{animation-delay:.08s}.stg.s3{animation-delay:.14s}
  .stg.s4{animation-delay:.2s}.stg.s5{animation-delay:.26s}
}
@keyframes rise{to{opacity:1;transform:none}}

/* mobile shell */
@media(max-width:940px){
  .app{flex-direction:column}
  .sidebar{width:auto; height:auto; position:sticky; top:0; flex-direction:row; align-items:center;
    padding:8px 12px; gap:2px; overflow-x:auto}
  .sb-brand{padding:6px 8px; border:0}
  .sb-brand span{display:none}
  .sb-sec,.sb-foot{display:none}
  .nav{width:auto; padding:8px 11px; white-space:nowrap}
  .nav[aria-current="page"]::before{display:none}
  .nav .label{display:none}
  .nav .count{margin-left:6px}
  .topin{height:auto; padding:10px 0; flex-wrap:wrap}
}

/* ── grid + cards ────────────────────────────────────────── */
.grid{display:grid; gap:16px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg)}
.card.pad{padding:18px 20px}
.card.lift{transition:transform .16s cubic-bezier(.2,.7,.2,1), box-shadow .16s, border-color .16s}
.card.lift:hover{transform:translateY(-2px); box-shadow:var(--sh-2); border-color:var(--line-strong)}
.card-h{display:flex; align-items:center; gap:10px; margin-bottom:14px}
.card-h h3{font-size:13.5px; font-weight:640}
.card-h .eyebrow{font-weight:600}
.card-h .spacer{flex:1}
.link{font-size:12px; font-weight:560; color:var(--accent); cursor:pointer; background:none; border:0;
  display:inline-flex; align-items:center; gap:4px; padding:2px 4px; border-radius:5px}
.link:hover{background:var(--accent-soft)}
.link svg{width:13px; height:13px; stroke-width:2}

/* status pill */
.pill{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; font-weight:600; padding:3px 9px 3px 8px;
  border-radius:20px; border:1px solid transparent; letter-spacing:.01em}
.pill .pd{width:6px; height:6px; border-radius:50%}
.pill.p-good{background:var(--good-soft); color:var(--good); border-color:var(--good-line)}
.pill.p-warn{background:var(--warn-soft); color:var(--warn); border-color:var(--warn-line)}
.pill.p-bad{background:var(--bad-soft); color:var(--bad); border-color:var(--bad-line)}
.pill.p-info{background:var(--info-soft); color:var(--info)}

/* ── hero (business health) ──────────────────────────────── */
.hero{display:grid; grid-template-columns:minmax(0,4.6fr) minmax(0,5.4fr); gap:0}
@media(max-width:860px){ .hero{grid-template-columns:1fr} }
.hero-l{padding:22px 24px; border-right:1px solid var(--line)}
@media(max-width:860px){ .hero-l{border-right:0; border-bottom:1px solid var(--line)} }
.hero-status{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px}
.hero-head{font-size:19px; font-weight:640; line-height:1.28; letter-spacing:-.022em; max-width:26ch}
.hstats{display:flex; gap:22px; margin-top:20px; flex-wrap:wrap}
.hstat .k{font-size:11px; color:var(--ink-3); font-weight:540; margin-bottom:5px}
.hstat .v{font-size:23px; font-weight:660; letter-spacing:-.03em; line-height:1}
.hstat .d{font-size:11px; margin-top:5px; font-weight:560}
.hero-r{padding:18px 22px; display:flex; flex-direction:column; min-width:0}
.chart-legend{display:flex; gap:16px; margin-top:6px; flex-wrap:wrap}
.leg{display:inline-flex; align-items:center; gap:6px; font-size:11px; color:var(--ink-2); font-weight:500}
.leg .ln{width:16px; height:0; border-top:2px solid currentColor; border-radius:2px}
.leg .ln.dash{border-top-style:dashed}

/* ── KPI cards ───────────────────────────────────────────── */
.kpis{grid-template-columns:repeat(5,1fr)}
@media(max-width:1080px){ .kpis{grid-template-columns:repeat(3,1fr)} }
@media(max-width:640px){ .kpis{grid-template-columns:repeat(2,1fr)} }
.kpi{padding:15px 16px 14px; display:flex; flex-direction:column; min-width:0}
.kpi-t{display:flex; align-items:center; gap:7px; margin-bottom:11px}
.kpi-t .kdot{width:6px; height:6px; border-radius:50%; flex:none}
.kpi-t .kn{font-size:11.5px; font-weight:560; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.kpi-num{font-size:26px; font-weight:660; letter-spacing:-.03em; line-height:1; margin-bottom:3px}
.kpi-num .u{font-size:.52em; font-weight:600; color:var(--ink-3); margin-left:3px; letter-spacing:0}
.kpi-of{font-size:11px; color:var(--ink-3); margin-bottom:auto}
.kbar{height:6px; background:var(--surface-3); border-radius:4px; overflow:hidden; position:relative; margin:13px 0 9px}
.kbar .f{position:absolute; inset:0 auto 0 0; width:0; border-radius:4px; transition:width .95s cubic-bezier(.3,.85,.3,1)}
.kbar .t{position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--ink); opacity:.55; z-index:2}
.kfoot{display:flex; align-items:center; justify-content:space-between; gap:6px}
.kach{font-size:13px; font-weight:660}
.kpace{font-size:11px; font-weight:640; display:inline-flex; align-items:center; gap:3px}
.kpace svg{width:11px; height:11px; stroke-width:2.4}

/* ── mini pipeline ───────────────────────────────────────── */
.pl-row{display:grid; grid-template-columns:26px 1fr auto; gap:12px; align-items:center; padding:9px 0; border-top:1px solid var(--line-2)}
.pl-row:first-child{border-top:0}
.pl-node{width:24px; height:24px; border-radius:7px; border:1px solid var(--line); display:grid; place-items:center;
  font-size:11px; font-weight:660; color:var(--ink-3)}
.pl-node.n-good{border-color:var(--good-line); color:var(--good); background:var(--good-soft)}
.pl-node.n-bad{border-color:var(--bad-line); color:var(--bad); background:var(--bad-soft)}
.pl-mid{min-width:0}
.pl-name{font-size:12.5px; font-weight:560}
.pl-sub{font-size:11px; color:var(--ink-3); margin-top:1px}
.pl-bar{height:5px; background:var(--surface-3); border-radius:3px; overflow:hidden; position:relative; margin-top:6px}
.pl-bar .f{position:absolute; inset:0 auto 0 0; width:0; border-radius:3px; transition:width .9s cubic-bezier(.3,.85,.3,1)}
.pl-bar .t{position:absolute; top:0; bottom:0; width:2px; background:var(--ink); opacity:.5; z-index:2}
.pl-pace{font-size:12px; font-weight:660; text-align:right; white-space:nowrap; min-width:46px}

/* ── attention list ──────────────────────────────────────── */
.att{display:flex; flex-direction:column}
.att-row{display:grid; grid-template-columns:auto 1fr auto; gap:12px; align-items:center; padding:12px 0; border-top:1px solid var(--line-2)}
.att-row:first-child{border-top:0}
.sev-dot{width:8px; height:8px; border-radius:50%; flex:none}
.att-t{font-size:12.5px; font-weight:560; line-height:1.35}
.att-o{font-size:11px; color:var(--ink-3); margin-top:2px}
.att-m{text-align:right; white-space:nowrap}
.att-m b{font-size:15px; font-weight:660; letter-spacing:-.02em; display:block}
.att-m span{font-size:10px; color:var(--ink-3); text-transform:uppercase; letter-spacing:.03em}

/* ── tables ──────────────────────────────────────────────── */
.tablecard{overflow:hidden}
.twrap{overflow-x:auto}
table{border-collapse:separate; border-spacing:0; width:100%; min-width:720px}
thead th{position:sticky; top:0; background:var(--surface-2); z-index:1; font-size:10.5px; font-weight:600;
  letter-spacing:.04em; text-transform:uppercase; color:var(--ink-3); text-align:right; padding:12px 14px;
  border-bottom:1px solid var(--line); white-space:nowrap; user-select:none}
thead th.l{text-align:left}
thead th.sortable{cursor:pointer; transition:color .13s}
thead th.sortable:hover{color:var(--ink)}
thead th .ar{display:inline-block; width:8px; margin-left:4px; color:var(--accent); opacity:0}
thead th[aria-sort] .ar{opacity:1}
tbody td{padding:13px 14px; border-bottom:1px solid var(--line-2); font-size:13px; text-align:right; vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr{transition:background .1s}
tbody tr:hover{background:var(--surface-2)}
tbody tr.rh td{background:linear-gradient(90deg,var(--surface-2),transparent 60%)}
td.l{text-align:left}
.rk{color:var(--ink-3); width:32px; font-weight:600; font-variant-numeric:tabular-nums}
.rk.top{color:var(--accent)}
.who{font-weight:560; font-size:13px; white-space:nowrap; display:flex; align-items:center; gap:8px}
.pfp{width:24px; height:24px; border-radius:50%; flex:none; display:grid; place-items:center; font-size:10px; font-weight:650; color:#fff}
.badge{font-size:8.5px; font-weight:600; letter-spacing:.06em; padding:2px 5px; border:1px solid var(--line-strong); border-radius:4px; color:var(--ink-3)}
.rsub{font-size:10.5px; color:var(--ink-3); margin-top:2px; font-weight:500}
.kv{font-size:12px; font-weight:560; font-variant-numeric:tabular-nums}
.meter{height:4px; background:var(--line-2); border-radius:3px; overflow:hidden; margin-top:6px}
.meter i{display:block; height:100%; width:0; border-radius:3px; transition:width .8s cubic-bezier(.3,.85,.3,1)}
.na{color:var(--ink-3)}
.score{font-size:15px; font-weight:680; font-variant-numeric:tabular-nums; letter-spacing:-.02em}
.delta{font-size:11px; font-variant-numeric:tabular-nums; margin-top:2px; display:inline-flex; align-items:center; gap:2px}
.delta svg{width:10px;height:10px;stroke-width:2.6}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--ink-4)}
.tcap{padding:12px 16px; border-top:1px solid var(--line-2); font-size:12px; color:var(--ink-2); line-height:1.55}
.tcap b{color:var(--ink); font-weight:600}
.tcap code{font-family:var(--mono); font-size:11px; background:var(--surface-2); border:1px solid var(--line-2); border-radius:4px; padding:1px 5px}

/* ── actions ─────────────────────────────────────────────── */
.acts{grid-template-columns:1fr 1fr}
@media(max-width:760px){ .acts{grid-template-columns:1fr} }
.act{padding:18px 20px; display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:start}
.act-ic{width:30px; height:30px; border-radius:9px; display:grid; place-items:center; flex:none}
.act-ic svg{width:16px; height:16px; stroke-width:2}
.act.sv-1 .act-ic{background:var(--bad-soft); color:var(--bad)}
.act.sv-2 .act-ic{background:var(--warn-soft); color:var(--warn)}

function grow(scope){
  var b=scope.querySelectorAll("[data-w]");
  if(RM){ b.forEach(function(x){x.style.width=x.getAttribute("data-w")+"%";}); return; }
  b.forEach(function(x){x.style.width="0";});
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    b.forEach(function(x){x.style.width=x.getAttribute("data-w")+"%";});
  });});
}
function countUp(el,to,dp,pre,suf){
  pre=pre||""; suf=suf||"";
  if(RM){ el.innerHTML=pre+fmt(to,dp)+suf; return; }
  var t0=null,dur=800;
  function step(ts){ if(!t0)t0=ts; var k=Math.min((ts-t0)/dur,1),e=1-Math.pow(1-k,3);
    el.innerHTML=pre+fmt(to*e,dp)+suf; if(k<1)requestAnimationFrame(step); else el.innerHTML=pre+fmt(to,dp)+suf; }
  requestAnimationFrame(step);
}

/* ═══════════ scoring ═══════════ */
function scoreOne(d,corr){
  var cells=[],earned=0,live=0;
  KRAS.forEach(function(K){
    var t=K.tgt(d),a=K.act(d),usable=K.count?t>=1:t>0;
    if(corr&&!usable){ cells.push({na:true}); return; }
    var ach=t>0?a/t:0; earned+=Math.min(ach,CAP)*K.w; live+=K.w;
    cells.push({na:false,ach:ach,undef:t<=0});
  });
  return {cells:cells, pct:Math.min(corr?(live>0?earned/live:0):earned/100,CAP), live:live};
}
function board(reg,corr){
  var rows=POCS.filter(function(d){return reg==="all"||d.r===reg;})
    .map(function(d){var s=scoreOne(d,corr);return {d:d,cells:s.cells,pct:s.pct,live:s.live};});
  rows.sort(function(a,b){return b.pct-a.pct;});
  rows.forEach(function(r,i){ r.rank=(i>0&&Math.abs(r.pct-rows[i-1].pct)<1e-9)?rows[i-1].rank:i+1; });
  return rows;
}

/* ═══════════ hero trajectory chart (SVG) ═══════════ */
function trajectory(reg){
  var series = reg==="all"
      ? GMV_DAILY.North.map(function(v,i){return v+GMV_DAILY.South[i];})
      : GMV_DAILY[reg].slice();
  var m=metric("gmv"), t=ta(m,reg), target=t[0];
  var cum=[], run=0; series.forEach(function(v){ run+=v; cum.push(run); });
  var mtd=cum[cum.length-1], rr=mtd/DAY, proj=mtd+rr*LEFT;
  var W=560,H=232, pl=34,pr=14,pt=16,pb=26;
  var ymax=Math.max(target,proj)*1.08;
  var X=function(day){ return pl+(day-1)/(DAYS-1)*(W-pl-pr); };
  var Y=function(v){ return H-pb-(v/ymax)*(H-pt-pb); };
  var g="";
  /* gridlines */
  var steps=[0,2,4,6].filter(function(v){return v<=ymax;}); if(ymax>6.5) steps.push(Math.ceil(ymax));
  steps.forEach(function(v){ var y=Y(v);
    g+='<line x1="'+pl+'" y1="'+y.toFixed(1)+'" x2="'+(W-pr)+'" y2="'+y.toFixed(1)+'" stroke="var(--line-2)"/>'+
       '<text x="'+(pl-8)+'" y="'+(y+3).toFixed(1)+'" text-anchor="end" font-size="9" fill="var(--ink-3)">₹'+v+'</text>';
  });
  /* x labels */
  [1,10,20,31].forEach(function(day){ g+='<text x="'+X(day).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="9" fill="var(--ink-3)">'+(day===10?"Today":day)+'</text>'; });
  /* target line */
  g+='<line x1="'+X(1)+'" y1="'+Y(target/DAYS).toFixed(1)+'" x2="'+X(DAYS)+'" y2="'+Y(target).toFixed(1)+'" stroke="var(--ink-4)" stroke-width="1.5" stroke-dasharray="5 4"/>';
  /* today marker */
  g+='<line x1="'+X(DAY).toFixed(1)+'" y1="'+pt+'" x2="'+X(DAY).toFixed(1)+'" y2="'+(H-pb)+'" stroke="var(--line-strong)" stroke-width="1"/>';
  /* actual area + line */
  var pts=cum.map(function(v,i){return X(i+1).toFixed(1)+","+Y(v).toFixed(1);});
  var area="M"+X(1).toFixed(1)+","+Y(0).toFixed(1)+" L"+pts.join(" L")+" L"+X(DAY).toFixed(1)+","+Y(0).toFixed(1)+" Z";
  g+='<path d="'+area+'" fill="var(--accent)" opacity="0.08"/>';
  g+='<polyline points="'+pts.join(" ")+'" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>';
  /* forecast */
  g+='<line x1="'+X(DAY).toFixed(1)+'" y1="'+Y(mtd).toFixed(1)+'" x2="'+X(DAYS).toFixed(1)+'" y2="'+Y(proj).toFixed(1)+'" stroke="var(--accent)" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>';
  /* endpoints */
  g+='<circle cx="'+X(DAY).toFixed(1)+'" cy="'+Y(mtd).toFixed(1)+'" r="3.6" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>';
  g+='<circle cx="'+X(DAYS).toFixed(1)+'" cy="'+Y(proj).toFixed(1)+'" r="3" fill="none" stroke="var(--accent)" stroke-width="1.6"/>';
  return {svg:'<svg viewBox="0 0 '+W+' '+H+'" width="100%" preserveAspectRatio="xMidYMid meet" role="img" aria-label="GMV cumulative actual versus target with forecast">'+g+'</svg>',
          proj:proj, target:target, mtd:mtd, attain:proj/target};
}

        miniK(row.cells[0])+miniK(row.cells[2])+miniK(row.cells[3])+miniK(row.cells[4])+

     get:function(r){return r.d.p;}},

function cv(c){ return !c||c.na?-1:c.undef?0:Math.min(c.ach,CAP); }
function kcell(c){
  if(!c||c.na) return '<span class="kv na" title="target below one whole unit — weight redistributed">n/a</span>';
  if(c.undef) return '<span class="kv na">0%<sup>†</sup></span><div class="meter"><i style="width:0"></i></div>';

  return '<span class="kv '+t+'">'+pct(s)+'</span><div class="meter"><i class="bg-'+t+'" data-w="'+(s/CAP*100).toFixed(0)+'"></i></div>';

/* generic sortable/searchable table */
function paintTable(tableEl, cols, rows, sortState, kind){
  var q=(kind==="team"||kind==="data")?state.q.trim().toLowerCase():"";
  var view=rows.slice();
  if(q) view=view.filter(function(r){ return cols.some(function(c){ return c.search && String(c.get(r)).toLowerCase().indexOf(q)>=0; }); });
  var sc=null; cols.forEach(function(c){ if(c.key===sortState.key) sc=c; });
  if(sc){ view.sort(function(a,b){ var av=sc.get(a),bv=sc.get(b);
    if(typeof av==="string") return sortState.dir==="asc"?av.localeCompare(bv):bv.localeCompare(av);
    return sortState.dir==="asc"?av-bv:bv-av; }); }
  var thead='<thead><tr>'+cols.map(function(c){
    var aria=c.key===sortState.key?' aria-sort="'+(sortState.dir==="asc"?"ascending":"descending")+'"':'';
    var ar=c.key===sortState.key?(sortState.dir==="asc"?"▲":"▼"):"";
    return '<th class="'+(c.l?"l ":"")+'sortable" data-k="'+c.key+'"'+aria+'>'+c.label+'<span class="ar">'+ar+'</span></th>';
  }).join("")+'</tr></thead>';
  var tbody='<tbody>'+view.map(function(r){
    return '<tr'+(r.d&&r.d.rh?' class="rh"':'')+'>'+cols.map(function(c){
      return '<td'+(c.l?' class="l"':'')+'>'+c.cell(r)+'</td>'; }).join("")+'</tr>';
  }).join("")+'</tbody>';
  tableEl.innerHTML=thead+tbody;
  requestAnimationFrame(function(){ grow(tableEl); });
  tableEl.querySelectorAll("th.sortable").forEach(function(th){
    th.addEventListener("click", function(){
      var k=th.dataset.k;
      if(sortState.key===k) sortState.dir=sortState.dir==="asc"?"desc":"asc";
      else { sortState.key=k; sortState.dir=(k==="name")?"asc":"desc"; }
      paintTable(tableEl, cols, rows, sortState, kind);
    });
  });
}
